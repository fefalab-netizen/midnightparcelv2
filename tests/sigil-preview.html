<!doctype html><html lang="en"><meta charset="utf-8"><title>Mawhound sigil journey</title><style>body{margin:0;color:#eee;background:#201c2b;font:16px system-ui}header{position:absolute;top:18px;left:22px;right:20px}h1{font:28px Georgia;margin:0 0 10px}button{padding:12px 18px;background:#70517e;color:#fff;border:1px solid #bd9ccf;border-radius:6px}p{max-width:650px;color:#c9bbd8}canvas{display:block}#progress{font-size:22px;color:#f0d8ff}</style><header><h1>Mawhound · The five-piece sigil</h1><button id="advance" disabled>Complete a simulated shift</button><button id="reset">Start preview over</button><p id="progress">Sigil: 0 / 5</p><p id="status">Preview only—your game save is untouched. Each click simulates a full shift with successful rescues.</p></header><script type="module">
import * as T from '../vendor/three.module.js';import {Game} from '../core.js';import {createMawhoundSigil,renderSigilAwakening} from '../sigil.js';import {loadMawhound} from '../mawhound.js';
const scene=new T.Scene();scene.background=new T.Color('#201c2b');const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,20);camera.position.set(.1,1.15,3.4);camera.lookAt(-.2,.7,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight('#f6e7ff','#504653',2));const light=new T.DirectionalLight('#ffffff',2);light.position.set(2,3,3);scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(6,6),new T.MeshStandardMaterial({color:'#363040',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const sigil=createMawhoundSigil();scene.add(sigil.root);const pet=await loadMawhound();scene.add(pet.root);pet.root.visible=false;let g=new Game(),reveal=-1,elapsed=0,last=0;g.sanctuary();const $=id=>document.getElementById(id);$('advance').disabled=false;
function label(){ $('progress').textContent=g.mawhoundAwakened&&g.save.awakeningSeen?`Mawhound · Level ${g.mawhoundLevel} · Sigil ${g.sigilPieces}/5`:`Mawhound sigil · ${g.sigilPieces}/5`;sigil.setPieces(g.sigilPieces);}
$('advance').onclick=()=>{
 g.start();let id=null,wait=0,stage='inspect';while(g.phase==='shift'){g.tick(.1);if(g.phase!=='shift')break;if(!g.parcel)continue;if(g.parcel.id!==id){id=g.parcel.id;wait=12;stage='inspect';}wait-=.1;if(wait>0)continue;if(stage==='inspect'){if(g.parcel.type==='safe'){g.ship();continue;}g.test(g.parcel.type);stage='treat';wait=.8;}else if(g.puzzle){g.act(g.puzzle.sequence[g.puzzle.step],true);wait=.8;}}
 g.sanctuary();label();$('status').textContent=`Shift ${g.save.shift-1} complete: ${g.fragmentsEarned} fragments recovered. ${g.message}`;
 if(g.mawhoundAwakened&&!g.save.awakeningSeen){$('advance').disabled=true;reveal=0;pet.setAutonomous(false);pet.play('Happy greeting');}
};
$('reset').onclick=()=>{g=new Game();g.sanctuary();reveal=-1;pet.setAutonomous(false);pet.root.visible=false;pet.root.position.set(0,0,0);pet.root.scale.setScalar(1);sigil.root.visible=true;sigil.setAwakened(false);$('advance').disabled=false;$('status').textContent='Preview reset. Your game save is untouched.';label();};
renderer.setAnimationLoop(t=>{const dt=Math.min((t-last)/1000,.05);last=t;elapsed+=dt;if(reveal>=0){reveal+=dt;if(renderSigilAwakening(sigil,pet,elapsed,reveal)){reveal=-1;g.save.awakeningSeen=true;sigil.setAwakened(true);label();pet.setAutonomous(true);$('advance').disabled=false;$('status').textContent='Mawhound has awakened. The sigil stays—five more fragments grant the next level.';}}else sigil.update(elapsed);if(pet.root.visible)pet.update(dt,{camera});renderer.render(scene,camera);});onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
</script></html>
