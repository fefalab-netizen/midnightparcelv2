<!doctype html><html lang="en"><meta charset="utf-8"><title>Mawhound animation studio</title><style>body{margin:0;background:#292633;color:#eee;font:14px system-ui}nav{position:absolute;top:18px;left:18px;right:18px;display:flex;gap:8px;flex-wrap:wrap}button,select{padding:12px;background:#493c59;color:#fff;border:1px solid #85728e;border-radius:6px}canvas{display:block}#status{position:absolute;bottom:14px;left:20px}</style><nav><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><select id="animation" aria-label="Animation"></select><button id="replay">Replay</button><button id="pause">Pause</button><input id="scrub" aria-label="Animation time" type="range" min="0" max="4" step="0.01" value="0"><button id="autonomy">Autonomous behavior: off</button></nav><p id="status">Loading Mawhound…</p><script type="module">
import * as T from '../vendor/three.module.js';import {loadMawhound} from '../mawhound.js';
const s=new T.Scene();s.background=new T.Color('#292633');const c=new T.PerspectiveCamera(38,innerWidth/innerHeight,.01,20);function view(x,z){c.position.set(x,1.1,z);c.lookAt(0,.7,0)}view(2.8,1.5);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x777788,2));const l=new T.DirectionalLight(0xffffff,3);l.position.set(2,3,4);s.add(l);
const floor=new T.Mesh(new T.PlaneGeometry(6,6),new T.MeshToonMaterial({color:'#403a4b'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;s.add(floor);s.add(new T.GridHelper(4,20,0x746580,0x52475e));
const m=await loadMawhound();s.add(m.root);const $=id=>document.getElementById(id),select=$('animation'),scrub=$('scrub'),pause=$('pause'),autonomy=$('autonomy');for(const clip of m.clips){const option=document.createElement('option');option.textContent=option.value=clip.name;select.appendChild(option);}let paused=false;
function manual(){m.setAutonomous(false);autonomy.textContent='Autonomous behavior: off';m.root.position.set(0,0,0);m.root.rotation.set(0,0,0);}
scrub.oninput=()=>{manual();paused=true;pause.textContent='Resume';m.pose(select.value,Number(scrub.value),c);};
function play(){manual();scrub.max=m.clips.find(clip=>clip.name===select.value).duration;paused=false;pause.textContent='Pause';m.play(select.value,{loop:true});}
select.onchange=play;$('replay').onclick=play;pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Resume':'Pause';};autonomy.onclick=()=>{m.setAutonomous(!m.autonomous);autonomy.textContent='Autonomous behavior: '+(m.autonomous?'on':'off');paused=false;pause.textContent='Pause';};
$('front').onclick=()=>view(0,3.1);$('side').onclick=()=>view(3.1,0);$('back').onclick=()=>view(0,-3.1);play();let last=0,ui=0;r.setAnimationLoop(t=>{const dt=Math.min((t-last)/1000,.05);if(!paused)m.update(dt,{camera:c});last=t;ui+=dt;if(ui>.15){ui=0;$('status').textContent=m.autonomous?`Mawhound is ${m.behaviorLabel} · position ${m.root.position.x.toFixed(2)}, ${m.root.position.z.toFixed(2)}`:select.value+(paused?' · paused':' · looping preview');}r.render(s,c)});onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);};
</script></html>
