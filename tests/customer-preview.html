<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night customer — model preview</title><style>body{margin:0;background:#24212e;color:#ded9e5;font:14px Arial}nav{position:fixed;top:18px;left:20px;z-index:1;display:flex;gap:8px}button{background:#494053;color:inherit;border:1px solid #8d819b;padding:12px;cursor:pointer}canvas{display:block}p{position:fixed;bottom:10px;left:20px;font-size:12px;color:#bcb0c7}</style><nav><button id="portrait">Portrait</button><button id="full">Full figure</button><button id="walk">Walk</button><button id="carry">Carry</button></nav><p>Original grey/violet customer · procedural mesh and joint animation</p><script type="module">
import * as THREE from '../vendor/three.module.js';import {createCustomer} from '../customer.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#292633');const camera=new THREE.PerspectiveCamera(33,innerWidth/innerHeight,.01,20);camera.position.set(.06,1.69,1.17);camera.lookAt(0,1.61,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#ebe6f0','#60576b',1.65));const light=new THREE.DirectionalLight('#f1e8ed',2.5);light.position.set(-2,3,3);scene.add(light);const rim=new THREE.DirectionalLight('#ab92db',1.3);rim.position.set(2,2,-1);scene.add(rim);
const model=createCustomer();scene.add(model.root);let walking=false,carrying=false;
document.getElementById('portrait').onclick=()=>{camera.position.set(.06,1.69,1.17);camera.lookAt(0,1.61,0);walking=false;carrying=false;};document.getElementById('full').onclick=()=>{camera.position.set(.35,1.15,3.5);camera.lookAt(0,.95,0);};document.getElementById('walk').onclick=()=>{walking=!walking;carrying=false;};document.getElementById('carry').onclick=()=>{carrying=!carrying;walking=false;};
window.onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};renderer.setAnimationLoop(t=>{model.animate(t/1000,{walking,carrying});renderer.render(scene,camera);});
</script></html>
